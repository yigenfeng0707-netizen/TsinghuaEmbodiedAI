# docker-compose.yml for JCIIOT FactorySorting
# 简化 Docker 容器启动，支持 GPU 加速和 X11 转发
#
# 使用方式：
#   docker-compose up -d        # 启动容器（后台）
#   docker-compose exec jciiot bash  # 进入容器
#   docker-compose down          # 停止容器
#
# 前置条件：
#   1. 安装 Docker: https://docs.docker.com/get-docker/
#   2. 安装 NVIDIA Container Toolkit: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html

services:
  jciiot:
    build: .
    image: jciiot:latest
    container_name: jciiot
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - MUJOCO_GL=egl
      - PYOPENGL_PLATFORM=egl
      - PYTHONPATH=/workspace/JCIIOT:/workspace/JCIIOT/robosuite/robosuite:/workspace/JCIIOT/robomimic:/workspace/JCIIOT/src
      - DISPLAY=${DISPLAY:-:0}
    volumes:
      # 挂载当前目录到容器内 /workspace
      - ./:/workspace
      # X11 socket（可选，用于可视化）
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # 模型 checkpoint 持久化（可选）
      - jciiot_models:/workspace/JCIIOT/robosuite/robosuite
    ports:
      - "8888:8888"  # Jupyter（可选）
      - "6006:6006"  # TensorBoard（可选）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: 16gb
    ulimits:
      memlock: -1
      stack: 67108864
    networks:
      - jciiot-net

networks:
  jciiot-net:
    driver: bridge

volumes:
  jciiot_models:
    driver: local
